<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Yash Raghuvanshi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #0a0a0a;
        color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        background-image: radial-gradient(50% 50% at 50% 40%, rgba(255, 180, 90, 0.12), transparent 70%);
      }
      .code {
        font-size: clamp(5rem, 22vw, 10rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.05em;
        color: transparent;
        -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.35);
      }
      h1 {
        margin: 16px 0 8px;
        font-size: clamp(1.5rem, 5vw, 2.25rem);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 28px;
        color: #a3a7b3;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 22px;
        border-radius: 14px;
        background: #fff;
        color: #0a0a0a;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 0.3s;
      }
      a:hover,
      a:focus-visible {
        background: #ffb45a;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>This page wandered off.</h1>
      <p>The link may be broken, or the page may have moved.</p>
      <a href="/">← Back to the portfolio</a>
    </main>
  </body>
</html>
