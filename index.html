    <script>
      // Decide before first paint whether the intro plays, so there's no flash of the page underneath.
      (() => {
        let seen = false;
        try { seen = sessionStorage.getItem("intro-seen") === "1"; } catch {}
        const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!seen && !reduced) document.documentElement.classList.add("intro-pending");
